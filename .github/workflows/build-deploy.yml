name: Nutrition Tracker CI/CD

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nutrition_test
          POSTGRES_USER: nutrition
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutrition -d nutrition_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: test-session-secret-with-32-chars-minimum
      JWT_SECRET_KEY: test-jwt-secret-with-32-chars-minimum
      DATABASE_URL: postgresql+psycopg://nutrition:test-password@localhost:5432/nutrition_test
      TEST_DATABASE_URL: postgresql+psycopg://nutrition:test-password@localhost:5432/nutrition_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m flask --app main db upgrade
      - run: python -m pytest -q
  publish_image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_DOCKER_IMAGE == 'true'
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/nutrition-tracker:latest
