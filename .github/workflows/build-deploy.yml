name: Nutrition Tracker CI/CD

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # App DB for migrations; tests use a separate *_test database.
          POSTGRES_DB: nutrition
          POSTGRES_USER: nutrition
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutrition -d nutrition"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: test-session-secret-with-32-chars-minimum
      JWT_SECRET_KEY: test-jwt-secret-with-32-chars-minimum
      DATABASE_URL: postgresql+psycopg://nutrition:test-password@localhost:5432/nutrition
      TEST_DATABASE_URL: postgresql+psycopg://nutrition:test-password@localhost:5432/nutrition_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Create isolated test database
        run: |
          container=$(docker ps --filter publish=5432 --format '{{.ID}}' | head -n 1)
          docker exec "$container" psql -U nutrition -d nutrition -v ON_ERROR_STOP=1 \
            -c "SELECT 1 FROM pg_database WHERE datname = 'nutrition_test'" | grep -q 1 \
            || docker exec "$container" psql -U nutrition -d nutrition -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE nutrition_test;"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m flask --app main db upgrade
      - run: python -m pytest -q
  publish_image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_DOCKER_IMAGE == 'true'
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/nutrition-tracker:latest

  deploy_vercel:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment: deployment
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      FDC_API_KEY: ${{ secrets.FDC_API_KEY }}
      API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY }}
      FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global vercel@latest
      - name: Check deployment settings
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$SECRET_KEY"
          test -n "$JWT_SECRET_KEY"
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Migrate PostgreSQL
        run: vercel env run -e production --token="$VERCEL_TOKEN" -- python -m flask --app main db upgrade
      - name: Deploy to Vercel
        run: |
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
            --build-env "SECRET_KEY=$SECRET_KEY" \
            --build-env "JWT_SECRET_KEY=$JWT_SECRET_KEY" \
            --env "SECRET_KEY=$SECRET_KEY" \
            --env "JWT_SECRET_KEY=$JWT_SECRET_KEY" \
            --env "FDC_API_KEY=$FDC_API_KEY" \
            --env "API_NINJAS_KEY=$API_NINJAS_KEY" \
            --env "FRONTEND_ORIGIN=$FRONTEND_ORIGIN"
