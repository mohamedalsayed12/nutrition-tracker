name: Nutrition Tracker CI/CD

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nutrition
          POSTGRES_USER: nutrition
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutrition -d nutrition"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: test-session-secret-with-32-chars-minimum
      JWT_SECRET_KEY: test-jwt-secret-with-32-chars-minimum
      DATABASE_URL: postgresql+psycopg://nutrition:test-password@localhost:5432/nutrition
      TEST_DATABASE_URL: postgresql+psycopg://nutrition:test-password@localhost:5432/nutrition_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Create isolated test database
        run: |
          container=$(docker ps --filter publish=5432 --format '{{.ID}}' | head -n 1)
          docker exec "$container" psql -U nutrition -d nutrition -v ON_ERROR_STOP=1 \
            -c "SELECT 1 FROM pg_database WHERE datname = 'nutrition_test'" | grep -q 1 \
            || docker exec "$container" psql -U nutrition -d nutrition -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE nutrition_test;"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m flask --app main db upgrade
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  publish_image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_DOCKER_IMAGE == 'true'
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/nutrition-tracker:latest

  deploy_heroku:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the React app
        working-directory: frontend
        env:
          VITE_API_URL: ''
        run: |
          npm ci
          npm run build
      - name: Deploy to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: nutrition-tracker-alsayed
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "HEROKU_API_KEY is not set, so this push is not deployed to Heroku."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f frontend/dist
          git commit -q -m "Deploy ${GITHUB_SHA::7} with the built React app"
          git push --force "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git" HEAD:main
