services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-nutrition}
      POSTGRES_USER: ${DATABASE_USERNAME:-nutrition}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - nutrition_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_HOSTNAME: database
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-nutrition}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-nutrition}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      FDC_API_KEY: ${FDC_API_KEY:-}
      API_NINJAS_KEY: ${API_NINJAS_KEY:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      database:
        condition: service_healthy

volumes:
  nutrition_postgres:
