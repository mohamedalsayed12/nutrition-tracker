<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>login page</title>
<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #000000, #000000, rgb(246 0 0));
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    color: white;
}

form {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    padding: 25px;
    border-radius: 12px;
    width: 350px;
    text-align: center;
    box-shadow: 0 8px 16px rgb(255 255 255 / 0.2);
}

label {
    display: block;
    font-size: 16px;
    margin: 10px 0 5px;
    font-weight: bold;
}

input {
    box-sizing: border-box;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    outline: none;
}

input::placeholder {
    color: rgba(255, 255, 255, 0.6);
}

input:focus {
    border: 2px solid #ffcc70;
}

button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #ff8c00, #ff3b3b);
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button[type="submit"] {
    width: 100%;
}

button:hover {
    background: linear-gradient(90deg, #ff3b3b, #ff8c00);
}

.password-container {
    display: flex;
    gap: 8px;
}

.toggle-btn {
    height: 40px;
}

a {
    color: rgb(27, 27, 236);
    font-weight: bold;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

@media (max-width: 400px) {
    form {
        width: 90%;
    }
}
</style>
</head>
<body>


<form method="post">
    {{ form.hidden_tag() }}
    <center style="color: #ff3b3b; border-radius: 20px;">{{message}}</center>
    <br>

  <h1 >Login</h1>

  <div class="container">
    <label for="uname"><b>Email</b></label>
    <input type="text" placeholder="Enter your email" name="email" required id="name">
    <h2 style="color: #ff3b3b; border-radius: 25px;">{{erorr2}}</h2>

   <br>
    <label for="password">Password:</label>
    <h2 style="color: #ff3b3b; border-radius: 25px;">{{erorr}}</h2>
    <div class="password-container" >
        <input type="password" id="password" name="password" required>
        <button type="button" class="toggle-btn" onclick="togglePassword()">👁️</button>
    </div>

    <br>

    <button type="submit">Login</button>
  </div>
  <br><br>
  <div class="container">  
    <span class="psw"><a href="{{ url_for('auth.registration_page') }}">Register now</a></span>
  </div>
</form>

</body>

<script>
    window.onload=function(){
        document.getElementById('name').focus();
    }



        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const toggleBtn = document.querySelector(".toggle-btn");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleBtn.textContent = "🙈";
            } else {
                passwordInput.type = "password";
                toggleBtn.textContent = "👁️";
            }
        }
</script>
</html>
