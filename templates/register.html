<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
{% include "_app_head.html" %}
</head>
<style>

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #000000, #000000, rgb(246 0 0));
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    color: white;
}


form {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    padding: 25px;
    border-radius: 12px;
    width: 350px;
    text-align: center;
    box-shadow: 0 8px 16px rgb(255 255 255 / 0.2);
}


label {
    display: block;
    font-size: 16px;
    margin: 10px 0 5px;
    font-weight: bold;
}


input {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    outline: none;
}


input::placeholder {
    color: rgba(255, 255, 255, 0.6);
}


input:focus {
    border: 2px solid #ffcc70;
}


button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #ff8c00, #ff3b3b);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: linear-gradient(90deg, #ff3b3b, #ff8c00);
}


a {
    font-family: 'Times New Roman', Times, serif;
    font-size: 40px;

    padding-left: 60px;
    display: block;
    margin-top: 15px;
    color:rgb(27, 27, 236);
    text-decoration: none;
    font-weight: bold;
}

a:hover {
    text-decoration: underline;
}


@media (max-width: 400px) {
    form {
        width: 90%;
    }
}

</style>
<body>

    <form action="" method="post">
        {{ form.hidden_tag() }}
        <center><h1 style="color: rgb(255 255 255);">REGISTER NOW</h1></center><br>
        <label for="name">Name</label>
        <input type="text" name="name" id="name" required>
        <label for="email">Enter Your Email</label>
        <input type="email" name="email" required>
        <h3 style="color: #ff3b3b;">{{error}}</h3>

        <label for="password"> Create Password</label>
        <p style="color: #ffffff; display: inline;">*make your password stronger</p>
        <br>
        <input type="password"name ="password" required>
        <button type="submit">submit</button>
    </form>
    <br><br>




<br><br>
<a href="{{ url_for('auth.login_page') }}">if you have a acoount</a>

</body>
<script>
    window.onload=function(){
        document.getElementById('name').focus();
    }
</script>
</html>
